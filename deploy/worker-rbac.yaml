# Install only in Meridian's dedicated application runtime cluster.
# Never grant this identity to the public API or customer workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: meridian-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-worker
  namespace: meridian-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meridian-runtime-worker
rules:
  - apiGroups: ['']
    resources: [namespaces, resourcequotas]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [secrets, services]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meridian-runtime-worker
subjects:
  - kind: ServiceAccount
    name: meridian-worker
    namespace: meridian-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meridian-runtime-worker
